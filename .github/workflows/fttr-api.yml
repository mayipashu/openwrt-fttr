name: FTTR API contract
on:
  push:
    paths: ['fttr/src/**', 'fttr/files/**', 'fttr/Makefile', 'fiberhome-fsl/**', '.github/workflows/fttr-api.yml']
  pull_request:
    paths: ['fttr/src/**', 'fttr/files/**', 'fttr/Makefile', 'fiberhome-fsl/**', '.github/workflows/fttr-api.yml']
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: LuCI frontend revision
        default: main
        required: true
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: openwrt-fttr
      - uses: actions/checkout@v4
        with:
          repository: mayipashu/luci-app-fttr
          ref: ${{ inputs.frontend_ref || vars.FTTR_FRONTEND_REF || 'main' }}
          path: luci-app-fttr
      - uses: dtolnay/rust-toolchain@stable
      - name: Build libuci for host tests
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libjson-c-dev pkg-config
          prefix="$RUNNER_TEMP/openwrt-uci"
          git clone https://git.openwrt.org/project/libubox.git "$RUNNER_TEMP/libubox"
          git -C "$RUNNER_TEMP/libubox" checkout a396f38a8568a1d670c240465cd8d24fdfdf6463
          cmake -S "$RUNNER_TEMP/libubox" -B "$RUNNER_TEMP/libubox-build" -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_LUA=OFF -DBUILD_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/libubox-build" --parallel
          cmake --install "$RUNNER_TEMP/libubox-build"
          git clone https://git.openwrt.org/project/uci.git "$RUNNER_TEMP/uci"
          # Match the version used by the Rust ABI bindings.
          git -C "$RUNNER_TEMP/uci" checkout 74f6277aabffc943d026f406df57c22595134c42
          cmake -S "$RUNNER_TEMP/uci" -B "$RUNNER_TEMP/uci-build" -DCMAKE_INSTALL_PREFIX="$prefix" -DCMAKE_PREFIX_PATH="$prefix" -DBUILD_LUA=OFF
          cmake --build "$RUNNER_TEMP/uci-build" --parallel
          cmake --install "$RUNNER_TEMP/uci-build"
          echo "LD_LIBRARY_PATH=$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      # UAPI drift guard: the C static asserts mirror the Rust transport tests.
      - run: cc -std=c11 -Wall -Werror -Ifiberhome-fsl/src fiberhome-fsl/tests/check-uapi.c -o /tmp/check-uapi && /tmp/check-uapi
        working-directory: openwrt-fttr
      - run: cargo fmt --all --check --manifest-path openwrt-fttr/fttr/src/Cargo.toml
      - run: cargo test --locked --workspace --manifest-path openwrt-fttr/fttr/src/Cargo.toml --features fttr-api/codegen
      - run: cargo test --locked --manifest-path openwrt-fttr/fttr/src/Cargo.toml --lib --no-default-features --features all-devices,acs,mqtt,npu
      - run: cargo check --locked --manifest-path openwrt-fttr/fttr/src/Cargo.toml --all-targets --no-default-features --features all-devices,acs,acs-bridge,mqtt,mqtt-bridge,npu,diagnostics
      - run: cargo check --locked --manifest-path openwrt-fttr/fttr/src/Cargo.toml --all-targets --no-default-features --features all-devices,acs,mqtt,mqtt-bridge,npu,diagnostics
      - run: cargo check --locked --manifest-path openwrt-fttr/fttr/src/Cargo.toml --all-targets --no-default-features --features all-devices,acs,mqtt,npu,diagnostics
      - run: cargo check --locked --manifest-path openwrt-fttr/fttr/src/Cargo.toml --all-targets --no-default-features --features all-devices,acs,diagnostics
      - run: cargo check --locked --manifest-path openwrt-fttr/fttr/src/Cargo.toml --all-targets --no-default-features
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: luci-app-fttr/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile && pnpm check
        working-directory: luci-app-fttr
